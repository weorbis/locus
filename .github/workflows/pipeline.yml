name: Pipeline

on:
  push:
    branches: [main, master]
    paths-ignore: ["**.md", ".gitignore"]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned for deterministic builds. Bumping is its own PR so the diff
  # surfaces toolchain changes and CI validates them before they land.
  #
  # Xcode is intentionally NOT pinned: GitHub's macOS runner images only
  # fully provision platform support files for the runner's *default*
  # Xcode. Forcing a non-default Xcode (e.g. via setup-xcode) has us
  # build against a base SDK whose platform isn't installed, which
  # surfaces as "iOS <X.Y> Platform Not Installed" errors. Pinning the
  # macOS runner family (macos-15) is the level of determinism that
  # works without paying for a multi-GB platform download per build.
  FLUTTER_VERSION: "3.47.0"
  JAVA_VERSION: "17"

defaults:
  run:
    shell: bash

jobs:
  # -----------------------------------------------------------------
  # STAGE 1: QUALITY ASSURANCE
  # -----------------------------------------------------------------
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}

      - run: flutter pub get

      - name: Version pins in sync with pubspec
        run: dart run tool/sync_version.dart --check

      - name: Format check
        run: dart format --set-exit-if-changed --output=none .

      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Unit Tests
        run: flutter test --coverage

      - name: Upload codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage/lcov.info
          # Fork PRs get no OIDC token; Codecov accepts their uploads without one.
          use_oidc: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }}
          fail_ci_if_error: true

      - name: Install pana
        run: |
          dart pub global activate pana
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      - name: Pana Score
        run: pana --no-warning --exit-code-threshold 130

  android-check:
    name: Android Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}
      - run: flutter pub get

      - name: Android Native Unit Tests
        working-directory: example/android
        run: ./gradlew :locus:testDebugUnitTest

      - name: Android Lint
        working-directory: example/android
        run: ./gradlew :locus:lintDebug

      - name: Compile Android Instrumentation Tests
        working-directory: example/android
        run: ./gradlew :locus:assembleDebugAndroidTest

      - name: Build Example APK
        run: cd example && flutter build apk --debug

  android-device-check:
    name: Android Device Check (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 29, 34, 36]
    steps:
      - name: Free disk space for the emulator
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}
      - run: flutter pub get

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build Instrumentation APK
        working-directory: example/android
        run: ./gradlew :locus:assembleDebugAndroidTest

      - name: Cache emulator system image
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /usr/local/lib/android/sdk/system-images/android-${{ matrix.api-level }}/google_apis/x86_64
          key: system-image-${{ matrix.api-level }}-google_apis-x86_64

      - name: Run Device Checks
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          # Each line runs separately; am instrument exits 0 even when checks fail.
          script: |
            adb install -r example/build/locus/outputs/apk/androidTest/debug/locus-debug-androidTest.apk
            adb shell am instrument -w dev.locus.test/dev.locus.core.ConfigSnapshotInstrumentation | tee instrumentation.log
            grep -q "Config snapshot instrumentation passed" instrumentation.log

  ios-check:
    name: iOS CocoaPods Check
    runs-on: macos-15
    env:
      FLUTTER_SWIFT_PACKAGE_MANAGER: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get

      - name: Verify CocoaPods native test specification
        run: >-
          pod ipc spec ios/locus.podspec |
          ruby -rjson -e
          'spec = JSON.parse(STDIN.read);
          abort "missing Tests test spec" unless spec.fetch("testspecs").any? {
          |item| item["name"] == "Tests" && item["source_files"] == "Tests/**/*.swift" }'

      - name: Test iOS Native Core Against Both Module Names
        run: |
          swift test --package-path ios
          LOCUS_NATIVE_TEST_MODULE=locus swift test --package-path ios --scratch-path ios/.build-lowercase

      - name: Create CocoaPods integration host
        run: |
          LOCUS_COCOAPODS_HOST="$RUNNER_TEMP/locus_cocoapods_host"
          flutter create --platforms=ios --project-name locus_cocoapods_host "$LOCUS_COCOAPODS_HOST"
          cd "$LOCUS_COCOAPODS_HOST"
          flutter pub add locus --path "$GITHUB_WORKSPACE"
          ruby -pi -e "gsub(/# platform :ios, '13\\.0'/, \"platform :ios, '14.0'\")" ios/Podfile
          ruby -pi -e "gsub('IPHONEOS_DEPLOYMENT_TARGET = 13.0;', 'IPHONEOS_DEPLOYMENT_TARGET = 14.0;')" ios/Runner.xcodeproj/project.pbxproj
          dart run locus:setup --ios-only

      - name: Build CocoaPods integration host
        run: cd "$RUNNER_TEMP/locus_cocoapods_host" && flutter build ios --no-codesign --debug

      - name: Verify CocoaPods plugin integration
        run: |
          LOCUS_COCOAPODS_HOST="$RUNNER_TEMP/locus_cocoapods_host"
          grep -q 'locus (from `.symlinks/plugins/locus/ios`)' "$LOCUS_COCOAPODS_HOST/ios/Podfile.lock"
          grep -q '^framework module locus {$' "$LOCUS_COCOAPODS_HOST/ios/Pods/Target Support Files/locus/locus.modulemap"
          grep -q 'PRODUCT_MODULE_NAME = locus;' "$LOCUS_COCOAPODS_HOST/ios/Pods/Pods.xcodeproj/project.pbxproj"

      - name: Verify iOS permission-handler definitions
        run: |
          LOCUS_COCOAPODS_HOST="$RUNNER_TEMP/locus_cocoapods_host"
          grep -q 'PERMISSION_LOCATION=1' "$LOCUS_COCOAPODS_HOST/ios/Pods/Pods.xcodeproj/project.pbxproj"
          grep -q 'PERMISSION_SENSORS=1' "$LOCUS_COCOAPODS_HOST/ios/Pods/Pods.xcodeproj/project.pbxproj"

  ios-swiftpm-check:
    name: iOS SwiftPM Check
    runs-on: macos-15
    env:
      # Flutter 3.47.0 supports SwiftPM but does not enable it by default.
      # Keep this explicit so the nested plugin package remains a real CI lane.
      FLUTTER_SWIFT_PACKAGE_MANAGER: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get

      - name: Build Example iOS with SwiftPM
        run: cd example && flutter build ios --no-codesign --debug

      - name: Verify SwiftPM plugin package graph
        run: |
          test -f example/ios/Flutter/ephemeral/Packages/FlutterGeneratedPluginSwiftPackage/Package.swift
          grep -q '.package(name: "locus"' example/ios/Flutter/ephemeral/Packages/FlutterGeneratedPluginSwiftPackage/Package.swift

  # -----------------------------------------------------------------
  # STAGE 2: QUALITY GATE
  # -----------------------------------------------------------------
  quality-gate:
    name: Quality Gate
    needs: [code-quality, android-check, android-device-check, ios-check, ios-swiftpm-check]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Final Review
        run: |
          if [ "${{ needs.code-quality.result }}" != "success" ]; then
            echo "::error::Code quality failed"
            exit 1
          fi
          if [ "${{ needs.android-check.result }}" != "success" ]; then
            echo "::error::Android check failed"
            exit 1
          fi
          if [ "${{ needs.android-device-check.result }}" != "success" ]; then
            echo "::error::Android device check failed"
            exit 1
          fi
          if [ "${{ needs.ios-check.result }}" != "success" ]; then
            echo "::error::iOS CocoaPods check failed"
            exit 1
          fi
          if [ "${{ needs.ios-swiftpm-check.result }}" != "success" ]; then
            echo "::error::iOS SwiftPM check failed"
            exit 1
          fi
          echo "All quality checks passed!"

  # -----------------------------------------------------------------
  # STAGE 3: RELEASE (GitHub Tag & Release only)
  # -----------------------------------------------------------------
  release:
    name: Release
    needs: [quality-gate]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Resolve version from pubspec.yaml
        id: check_version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d '[:space:]')
          if [ -z "$VERSION" ]; then
            echo "::error::Could not parse version from pubspec.yaml"
            exit 1
          fi

          if git ls-remote --tags origin | grep -q "refs/tags/v$VERSION"; then
            echo "Tag v$VERSION already exists on remote. Skipping release."
            echo "do_release=false" >> $GITHUB_OUTPUT
          else
            echo "New version $VERSION detected. Proceeding with release."
            echo "do_release=true" >> $GITHUB_OUTPUT
            echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Create Git Tag
        if: steps.check_version.outputs.do_release == 'true'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag -a "v${{ steps.check_version.outputs.VERSION }}" -m "Release v${{ steps.check_version.outputs.VERSION }}"
          git push origin "v${{ steps.check_version.outputs.VERSION }}"

      - name: Create GitHub Release
        if: steps.check_version.outputs.do_release == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: "v${{ steps.check_version.outputs.VERSION }}"
          generate_release_notes: true
          body: |
            Release v${{ steps.check_version.outputs.VERSION }}

            Publishing to pub.dev starts after approval in the pub.dev environment.
            See CHANGELOG.md for details.

      - name: Start pub.dev publishing
        if: steps.check_version.outputs.do_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run publish.yml --ref "v${{ steps.check_version.outputs.VERSION }}"
