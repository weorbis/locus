name: locus_example
version: 1.0.0
description: Demonstrates how to use the Locus background geolocation plugin.

publish_to: "none"

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

  google_fonts: ^9.0.0
  flutter_svg: ^2.3.2
  material_ui: ^1.10.0

  locus:
    path: ../

  cupertino_icons: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/
